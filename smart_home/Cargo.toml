[package]
name = "smart_home"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smart home library with thermometers and sockets supporting TCP/UDP"

[dependencies]
thiserror = "1"
log = "0.4"
env_logger = "0.11"
anyhow = { version = "1", optional = true }
# socket2, ctrlc, and anyhow are only needed by the binary targets (emulators),
# not by the library itself.  They are optional so that downstream crates
# depending on smart_home as a library can use `default-features = false` to
# avoid pulling them in.
socket2 = { version = "0.5", optional = true }
ctrlc = { version = "3", optional = true }

[features]
default = ["socket2", "ctrlc", "anyhow"]

[[bin]]
name = "socket_emulator"
path = "src/bin/socket_emulator.rs"

[[bin]]
name = "thermo_emulator"
path = "src/bin/thermo_emulator.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "demo_network"
path = "examples/demo_network.rs"

[[example]]
name = "demo_patterns"
path = "examples/demo_patterns.rs"
